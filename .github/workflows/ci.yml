name: CI

on:
  pull_request:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Tests (placeholder)
        run: npm test
