name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy
        required: true
        default: master

concurrency:
  group: deploy-yc-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Deploy function version
        uses: yc-actions/yc-sls-function@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: b1givfkfh806tp641l6l
          function-name: duty-group-bot
          bucket: duty-group-bot-deploy
          runtime: nodejs22
          memory: 128Mb
          entrypoint: dist/index.handler
          execution-timeout: '60'
          service-account: ajerdikcv0fdb1s370uf
          environment: |
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            OWNER_ID=${{ secrets.OWNER_ID }}
            AWS_ACCESS_KEY_ID=${{ secrets.YC_S3_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
            AWS_REGION=ru-central1
          include: |
            dist/**
            package.json
          exclude: |
            .github/**
            .git/**
            **/*.md
            eslint.config.js
            tsconfig.json
            esbuild.config.mjs
            vitest.config.ts
            src/**
            tests/**
            node_modules/**
